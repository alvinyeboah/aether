name: Bug report
description: Help improve the Aether developer preview.
body:
  - type: input
    id: version
    attributes:
      label: Aether version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the expected and actual behavior. Remove private URLs, credentials and account information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no passwords, access tokens, private browsing history, or sensitive account screenshots.
          required: true
